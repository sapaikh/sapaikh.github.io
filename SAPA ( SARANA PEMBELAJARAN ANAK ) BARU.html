<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAPA - Sarana Pembelajaran Anak</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --bg:#EFF6FF;
    --bg-soft:#DCEBFC;
    --card:#FFFFFF;
    --ink:#16324F;
    --ink-soft:#5A7897;
    --border:#D7E4F2;

    --typing:#F5A524;
    --typing-dark:#B97A0E;
    --typing-tint:#FFF3DC;

    --math:#E85D4A;
    --math-dark:#B8402F;
    --math-tint:#FFE6E1;

    --lit:#7C6FE0;
    --lit-dark:#5B4FC4;
    --lit-tint:#ECE9FE;

    --good:#2A9D8F;
    --good-dark:#1F7A6F;
    --bad:#E63946;

    --lp:#EF6F6C; --lr:#F4A261; --lm:#F7C948; --li:#6FCF97;
    --ri:#56C2D6; --rm:#6C8EF5; --rr:#A78BFA; --rp:#F472B6; --thumb:#9CA3AF;

    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:8px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 85% -10%, var(--bg-soft) 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.btn,.card-title,.q-text{font-family:'Baloo 2',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, input:focus-visible, .kb-key:focus-visible{
    outline:3px solid var(--good);
    outline-offset:2px;
  }

  #app-root{max-width:900px;margin:0 auto;padding:20px 18px 110px;}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;min-height:44px;}
  .brand{font-weight:800;font-size:1.35rem;color:var(--ink);letter-spacing:.2px;}
  .brand small{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.72rem;color:var(--ink-soft);}
  .brand-mini{font-weight:800;color:var(--ink-soft);font-size:.8rem;letter-spacing:.3px;}
  .back-btn{
    display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--border);
    border-radius:999px;padding:8px 14px 8px 10px;color:var(--ink);font-weight:700;font-size:.9rem;
    box-shadow:0 2px 0 var(--border);
  }
  .back-btn:active{transform:translateY(1px);box-shadow:none;}
  .view-title{font-weight:700;color:var(--ink-soft);font-size:.95rem;}
  .spacer{flex:1;}

  .share-btn{
    display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--border);
    border-radius:999px;padding:8px 14px;color:var(--ink);font-weight:700;font-size:.85rem;
    box-shadow:0 2px 0 var(--border);
  }
  .share-btn:active{transform:translateY(1px);box-shadow:none;}
  .share-btn.icon-only{padding:8px;}

  /* ---------- QR share modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,50,79,.55);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-card{
    background:#fff;border-radius:var(--radius-lg);padding:28px 24px;max-width:340px;width:100%;
    text-align:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);
  }
  .modal-card h3{margin:0 0 6px;font-size:1.2rem;}
  .modal-card p{margin:0 0 16px;color:var(--ink-soft);font-size:.88rem;line-height:1.5;}
  #qrcodeCanvas{display:flex;justify-content:center;margin-bottom:16px;min-height:200px;align-items:center;}
  #qrcodeCanvas img{border-radius:10px;border:1px solid var(--border);padding:8px;background:#fff;}
  .link-box{display:flex;gap:8px;margin-bottom:6px;}
  .link-box input{
    flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.78rem;
    color:var(--ink-soft);background:var(--bg);min-width:0;
  }
  .copy-msg{font-size:.8rem;color:var(--good-dark);font-weight:700;margin:6px 0 14px;min-height:1.2em;}
  .modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- home ---------- */
  .hero{text-align:center;padding:18px 8px 8px;}
  .hero h1{font-size:2.1rem;margin:0 0 10px;color:var(--ink);}
  .hero p{font-size:1.02rem;color:var(--ink-soft);max-width:520px;margin:0 auto;line-height:1.55;}

  .menu-grid{display:flex;gap:20px;margin-top:26px;flex-wrap:wrap;}
  .menu-card{
    flex:1 1 260px;background:var(--card);border-radius:var(--radius-lg);
    border:1px solid var(--border);overflow:hidden;
    box-shadow:0 10px 24px -14px rgba(22,50,79,.25);
    display:flex;flex-direction:column;
  }
  .menu-card .strip{height:7px;width:100%;}
  .menu-card .body{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .menu-card .icon-badge{
    width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;
  }
  .menu-card h2{margin:2px 0 0;font-size:1.3rem;}
  .menu-card p{margin:0;color:var(--ink-soft);font-size:.95rem;line-height:1.5;flex:1;}
  .menu-card .btn{margin-top:6px;align-self:flex-start;}

  .btn{
    border:none;border-radius:999px;padding:11px 20px;font-weight:700;font-size:.95rem;color:#fff;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .btn:active{transform:translateY(2px);box-shadow:none;}
  .btn.typing-btn{background:var(--typing-dark);}
  .btn.math-btn{background:var(--math-dark);}
  .btn.lit-btn{background:var(--lit-dark);}
  .btn.good-btn{background:var(--good-dark);}
  .btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--border);box-shadow:0 2px 0 var(--border);}
  .btn[disabled]{opacity:.45;pointer-events:none;}

  /* ---------- section heading blocks ---------- */
  .section-head{margin-bottom:18px;}
  .section-head h2{font-size:1.4rem;margin:0 0 6px;}
  .section-head p{margin:0;color:var(--ink-soft);font-size:.95rem;line-height:1.5;max-width:560px;}

  /* ---------- keyboard diagram ---------- */
  .kb-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 16px;margin:18px 0;}
  .kb-row{display:flex;gap:6px;justify-content:center;margin-bottom:6px;}
  .kb-key{
    flex:1;max-width:56px;aspect-ratio:1/0.9;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#16324F;font-size:.95rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .kb-key.active{transform:translateY(-4px) scale(1.08);box-shadow:0 6px 12px -4px rgba(22,50,79,.4), inset 0 -3px 0 rgba(0,0,0,.15);outline:3px solid var(--ink);}
  .kb-row.space-row{margin-top:2px;}
  .kb-key.space{flex:0 0 220px;max-width:none;font-size:.78rem;}

  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;margin-top:16px;}
  .legend .chip{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--ink-soft);font-weight:700;}
  .legend .swatch{width:14px;height:14px;border-radius:5px;display:inline-block;}

  /* ---------- lesson list ---------- */
  .lesson-list{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .lesson-item{
    display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:14px 16px;flex-wrap:wrap;
  }
  .lesson-num{
    width:36px;height:36px;flex:0 0 auto;border-radius:50%;background:var(--typing-tint);color:var(--typing-dark);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Baloo 2',sans-serif;
  }
  .lesson-info{flex:1;min-width:160px;}
  .lesson-info h3{margin:0 0 3px;font-size:1.02rem;}
  .lesson-info p{margin:0;color:var(--ink-soft);font-size:.85rem;line-height:1.4;}
  .status-chip{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .status-chip.done{background:#DFF3EF;color:var(--good-dark);}
  .status-chip.todo{background:#EEF2F7;color:var(--ink-soft);}

  /* ---------- typing practice ---------- */
  .practice-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-top:8px;}
  .practice-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .practice-meta .tag{font-size:.85rem;font-weight:700;color:var(--typing-dark);background:var(--typing-tint);padding:5px 12px;border-radius:999px;}
  .stat-row{display:flex;gap:22px;flex-wrap:wrap;}
  .stat{font-size:.85rem;color:var(--ink-soft);font-weight:700;}
  .stat b{color:var(--ink);font-size:1rem;}

  .target-text{
    font-family:'Nunito',sans-serif;font-size:1.35rem;line-height:2.1;letter-spacing:.5px;
    background:var(--bg);border-radius:var(--radius-md);padding:18px 20px;margin:16px 0;
    word-break:break-word;
  }
  .target-text span{padding:1px 0;border-radius:3px;}
  .ch-pending{color:var(--ink-soft);}
  .ch-correct{color:var(--good-dark);background:#DFF3EF;}
  .ch-incorrect{color:var(--bad);background:#FCE3E4;text-decoration:underline wavy var(--bad);}
  .ch-current{border-bottom:3px solid var(--typing-dark);}
  .ch-space{border-bottom:2px solid var(--border);}

  #typingInput{
    width:100%;padding:13px 16px;font-size:1.1rem;font-family:'Nunito',sans-serif;
    border:2px solid var(--border);border-radius:var(--radius-md);outline:none;background:#fff;color:var(--ink);
  }
  #typingInput:focus{border-color:var(--typing);}
  #typingInput[readonly]{background:var(--bg);color:var(--ink-soft);}

  .finish-banner{
    margin-top:16px;background:var(--typing-tint);border-radius:var(--radius-md);padding:16px 18px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  }
  .finish-banner p{margin:0;font-weight:700;color:var(--typing-dark);}
  .finish-banner .nums{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin-top:2px;}

  /* ---------- literasi ---------- */
  .story-grid{display:flex;flex-direction:column;gap:14px;margin-top:6px;}
  .story-card{
    display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:16px 18px;flex-wrap:wrap;
  }
  .story-icon{
    width:52px;height:52px;flex:0 0 auto;border-radius:16px;background:var(--lit-tint);
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;
  }
  .story-info{flex:1;min-width:170px;}
  .story-info .tag{display:inline-block;font-size:.72rem;font-weight:800;color:var(--lit-dark);background:var(--lit-tint);padding:3px 10px;border-radius:999px;margin-bottom:4px;}
  .story-info h3{margin:0 0 3px;font-size:1.05rem;}
  .story-info p{margin:0;color:var(--ink-soft);font-size:.85rem;line-height:1.4;}

  .story-reader{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 24px;}
  .story-reader .tag{display:inline-block;font-size:.75rem;font-weight:800;color:var(--lit-dark);background:var(--lit-tint);padding:4px 12px;border-radius:999px;margin-bottom:10px;}
  .story-reader h2{margin:0 0 16px;font-size:1.5rem;}
  .story-reader p{line-height:1.75;font-size:1.02rem;color:var(--ink);margin:0 0 14px;}
  .moral-box{
    margin-top:18px;background:var(--lit-tint);border-radius:var(--radius-md);padding:16px 18px;
    display:flex;gap:12px;align-items:flex-start;
  }
  .moral-box .m-icon{font-size:1.3rem;}
  .moral-box p{margin:0;font-weight:700;color:var(--lit-dark);line-height:1.5;}
  .read-toggle-row{margin-top:20px;display:flex;justify-content:flex-end;}

  /* ---------- calistung menu ---------- */
  .choice-grid{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;}
  .choice-card{
    flex:1 1 200px;background:var(--card);border:2px solid var(--border);border-radius:var(--radius-md);
    padding:18px;text-align:center;font-weight:700;
  }
  .choice-card .op-icon{font-size:1.8rem;margin-bottom:6px;display:block;}
  .choice-card.selected{border-color:var(--math);background:var(--math-tint);}
  .choice-card small{display:block;font-weight:600;color:var(--ink-soft);font-size:.8rem;margin-top:4px;}

  .level-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px;}
  .level-btn{
    flex:1 1 140px;background:var(--card);border:2px solid var(--border);border-radius:var(--radius-md);
    padding:13px;font-weight:700;color:var(--ink);
  }
  .level-btn.selected{border-color:var(--math);background:var(--math-tint);color:var(--math-dark);}

  /* ---------- game ---------- */
  .game-topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .progress-track{flex:1;min-width:140px;height:10px;background:var(--border);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--math);border-radius:999px;transition:width .3s ease;}
  .score-badge{font-weight:800;background:var(--math-tint);color:var(--math-dark);padding:6px 14px;border-radius:999px;font-size:.9rem;}
  .streak-badge{font-weight:800;background:#FFF0D6;color:#B5720B;padding:6px 12px;border-radius:999px;font-size:.85rem;}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:34px 22px;text-align:center;}
  .q-text{font-size:2.4rem;font-weight:700;color:var(--ink);margin-bottom:26px;}
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:0 auto;}
  .opt-btn{
    background:#fff;border:2px solid var(--border);border-radius:var(--radius-md);padding:16px 10px;
    font-size:1.3rem;font-weight:800;color:var(--ink);font-family:'Baloo 2',sans-serif;
  }
  .opt-btn.correct{background:#DFF3EF;border-color:var(--good);color:var(--good-dark);}
  .opt-btn.incorrect{background:#FCE3E4;border-color:var(--bad);color:var(--bad);}
  .opt-btn[disabled]{pointer-events:none;}
  .feedback-msg{margin-top:20px;font-weight:800;font-size:1.05rem;min-height:1.4em;}
  .feedback-msg.ok{color:var(--good-dark);}
  .feedback-msg.no{color:var(--bad);}

  /* ---------- result ---------- */
  .result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 24px;text-align:center;}
  .stars{font-size:2.6rem;letter-spacing:8px;margin-bottom:10px;}
  .result-score{font-size:2rem;font-weight:800;margin:6px 0 2px;}
  .result-sub{color:var(--ink-soft);font-weight:700;margin-bottom:22px;}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;
    background:#fff;border-top:1px solid var(--border);display:flex;
    box-shadow:0 -8px 24px -16px rgba(22,50,79,.4);z-index:50;
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .tab-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    padding:10px 6px 8px;color:var(--ink-soft);font-weight:800;font-size:.72rem;font-family:'Baloo 2',sans-serif;
  }
  .tab-btn.active.home{color:var(--good-dark);}
  .tab-btn.active.materi{color:var(--typing-dark);}
  .tab-btn.active.game{color:var(--math-dark);}

  @keyframes popin{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
  @media (prefers-reduced-motion: no-preference){
    .view-enter{animation:fadein .28s ease;}
    .stars span{display:inline-block;animation:popin .5s ease backwards;}
    .stars span:nth-child(2){animation-delay:.12s;}
    .stars span:nth-child(3){animation-delay:.24s;}
  }
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:520px){
    .hero h1{font-size:1.6rem;}
    .kb-key{font-size:.78rem;border-radius:7px;}
    .kb-row{gap:4px;}
    .q-text{font-size:1.9rem;}
    .options-grid{grid-template-columns:1fr 1fr;gap:10px;}
  }
</style>
</head>

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){

  function computeStats(){
    var t = state.typing;
    var correctChars = 0;
    for(var i=0;i<t.target.length;i++){
      if(t.typed[i]===t.target[i]) correctChars++;
    }
    var accuracy = t.target.length ? Math.round((correctChars/t.target.length)*100) : 100;
    var elapsedMs = t.startTime ? (Date.now()-t.startTime) : 0;
    var elapsedMin = Math.max(elapsedMs/60000, 1/60);
    var wpm = Math.round((t.target.length/5)/elapsedMin);
    var elapsedSec = Math.max(1,Math.round(elapsedMs/1000));
    return {accuracy:accuracy, wpm:wpm, elapsedSec:elapsedSec};
  }

      var cls = 'ch-pending';
      if(i < t.typed.length){
        cls = (t.typed[i]===ch) ? 'ch-correct' : 'ch-incorrect';
      } else if(i === t.typed.length && !t.finished){
        cls += ' ch-current';
      }
      if(ch===' ') cls += ' ch-space';
      targetHtml += '<span class="' + cls + '">' + display + '</span>';
    }

    var html = '' +

        '<div class="practice-meta">' +

  function makeOptions(correct){
    var opts = {};
    opts[correct] = true;
    var vals = [correct];
    var guard = 0;
    while(vals.length < 4 && guard < 60){
      guard++;
      var delta = randInt(1,6) * (Math.random()<0.5?-1:1);
      var val = correct + delta;
      if(val>=0 && !opts[val]){
        opts[val]=true;
        vals.push(val);
      }
    }
    while(vals.length<4){ vals.push(vals[vals.length-1]+1); }
    return shuffle(vals);
  }

  function generateQuestion(){
    var c = state.cal;
    var a,b,answer,qText;
    if(c.operation==='tambah'){
      if(c.level===1){ a=randInt(1,10); b=randInt(1,10); }
      else if(c.level===2){ a=randInt(10,50); b=randInt(10,50); }
      else { a=randInt(50,200); b=randInt(50,200); }
      answer = a+b;
      qText = a + ' + ' + b;
    } else if(c.operation==='kurang'){
      if(c.level===1){ a=randInt(5,20); b=randInt(1,a); }
      else if(c.level===2){ a=randInt(20,100); b=randInt(10,a); }
      else { a=randInt(100,500); b=randInt(50,a); }
      answer = a-b;
      qText = a + ' &minus; ' + b;
    } else if(c.operation==='kali'){
      if(c.level===1){ a=randInt(1,5); b=randInt(1,5); }
      else if(c.level===2){ a=randInt(2,10); b=randInt(2,10); }
      else { a=randInt(5,12); b=randInt(5,12); }
      answer = a*b;
      qText = a + ' &times; ' + b;
    } else {
      var divisor, quotient;
      if(c.level===1){ divisor=randInt(2,5); quotient=randInt(1,10); }
      else if(c.level===2){ divisor=randInt(2,10); quotient=randInt(2,12); }
      else { divisor=randInt(2,12); quotient=randInt(2,15); }
      answer = quotient;
      qText = (divisor*quotient) + ' &divide; ' + divisor;
    }
    return {qText:qText, answer:answer, options:makeOptions(answer)};
  }

  function renderApp(){
    var root = document.getElementById('app-root');
    var body;
    if(state.view==='home') body = viewHome();
    else if(state.view==='materiMenu') body = viewMateriMenu();
    else if(state.view==='literasiMenu') body = viewLiterasiMenu();
    else if(state.view==='storyReader') body = viewStoryReader();
    else if(state.view==='typingMenu') body = viewTypingMenu();
    else if(state.view==='typingLesson') body = viewTypingLesson();
    else if(state.view==='calistungMenu') body = viewCalistungMenu();
    else if(state.view==='calistungGame') body = viewCalistungGame();
    else if(state.view==='calistungResult') body = viewCalistungResult();

    root.innerHTML = '<div class="view-enter">' + renderHeader() + body + '</div>' + renderTabbar() + renderQRModal();
    attachListeners();

    if(state.qrOpen){
      var qrEl = document.getElementById('qrcodeCanvas');
      if(qrEl){
        qrEl.innerHTML = '';

          new QRCode(qrEl, {
            text: location.href,
            width: 200,
            height: 200,
            colorDark: '#16324F',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        } else {
          qrEl.innerHTML = '<p style="color:var(--ink-soft);font-size:.85rem;">QR code tidak dapat dimuat (perlu koneksi internet).</p>';
        }

    if(state.view==='typingLesson'){
      var input = document.getElementById('typingInput');
      if(input){
        input.focus();
        input.selectionStart = input.selectionEnd = input.value.length;

  /* ================= NAVIGATION ================= */

  function clearTypingTimer(){
    if(typingTimer){ clearInterval(typingTimer); typingTimer=null; }
  }
  function clearAdvanceTimeout(){
    if(advanceTimeout){ clearTimeout(advanceTimeout); advanceTimeout=null; }
  }

  function goTab(tab){
    clearTypingTimer(); clearAdvanceTimeout();
    if(tab==='home') state.view='home';
    else if(tab==='materi') state.view='materiMenu';
    else state.view='calistungMenu';
    renderApp();
  }

  function goBack(){
    clearAdvanceTimeout();
    switch(state.view){
      case 'materiMenu': state.view='home'; break;
      case 'typingMenu': state.view='materiMenu'; break;
      case 'typingLesson': clearTypingTimer(); state.view='typingMenu'; break;
      case 'literasiMenu': state.view='materiMenu'; break;
      case 'storyReader': state.view='literasiMenu'; break;
      case 'calistungMenu': state.view='home'; break;
      case 'calistungGame': state.view='calistungMenu'; break;
      case 'calistungResult': state.view='calistungMenu'; break;
      default: state.view='home';
    }
    renderApp();
  }

  function startLesson(index){
    state.lessonIndex = index;
    state.snippetIndex = 0;
    startSnippet();
  }

  function startSnippet(){
    clearTypingTimer();
    var lesson = LESSONS[state.lessonIndex];
    state.typing = {target: lesson.texts[state.snippetIndex], typed:'', startTime:null, finished:false};
    state.view = 'typingLesson';
    renderApp();
    typingTimer = setInterval(function(){
      if(!state.typing.finished && state.typing.startTime){
        renderApp();
      }
    }, 500);
  }

  function handleTypingInput(e){
    var t = state.typing;
    if(t.finished) return;
    var val = e.target.value;
    if(val.length > t.target.length) val = val.slice(0, t.target.length);
    if(!t.startTime && val.length>0) t.startTime = Date.now();
    t.typed = val;
    if(val.length >= t.target.length && t.target.length>0){
      t.finished = true;
      clearTypingTimer();
    }
    renderApp();
  }

  function nextSnippet(){
    var lesson = LESSONS[state.lessonIndex];
    if(state.snippetIndex >= lesson.texts.length-1){
      state.completedLessons[state.lessonIndex] = true;
      state.view = 'typingMenu';
      renderApp();
    } else {
      state.snippetIndex++;
      startSnippet();
    }
  }

  function openStory(key){
    state.storyKey = key;
    state.view = 'storyReader';
    renderApp();
  }

  function markStoryRead(){
    if(state.storyKey) state.readStories[state.storyKey] = true;
    renderApp();
  }

  function startGame(){
    var c = state.cal;
    c.qIndex = 0; c.score = 0; c.correct = 0; c.streak = 0;
    c.answered = false; c.picked = null;
    c.current = generateQuestion();
    state.view = 'calistungGame';
    renderApp();
  }

  function answerQuestion(val){
    var c = state.cal;
    if(c.answered) return;
    c.answered = true;
    c.picked = val;
    if(val === c.current.answer){
      c.correct++;
      c.streak++;
      var bonus = (c.streak>0 && c.streak%3===0) ? 5 : 0;
      c.score += 10 + bonus;
    } else {
      c.streak = 0;
    }
    renderApp();
    advanceTimeout = setTimeout(function(){
      c.qIndex++;
      if(c.qIndex >= c.total){
        state.view = 'calistungResult';
        renderApp();
      } else {
        c.answered = false;
        c.picked = null;
        c.current = generateQuestion();
        renderApp();
      }
    }, 1200);
  }

  function openQRModal(){
    state.qrOpen = true;
    renderApp();
  }

  function closeQRModal(){
    state.qrOpen = false;
    renderApp();
  }

  function copyShareLink(){
    var input = document.getElementById('qrLinkInput');
    var msg = document.getElementById('copyMsg');
    function showCopied(){ if(msg) msg.textContent = 'Tautan berhasil disalin!'; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(location.href).then(showCopied).catch(function(){
        fallbackCopy(input, showCopied);
      });
    } else {
      fallbackCopy(input, showCopied);
    }
  }

  function fallbackCopy(input, cb){
    if(!input) return;
    input.select();
    input.setSelectionRange(0, 99999);
    try{ document.execCommand('copy'); cb(); }catch(e){}
  }

  /* ================= EVENTS ================= */

  function attachListeners(){
    var backBtn = document.getElementById('btnBack');
    if(backBtn) backBtn.addEventListener('click', goBack);

    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ goTab(btn.getAttribute('data-tab')); });
    });

    document.querySelectorAll('[data-goto]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.view = btn.getAttribute('data-goto'); renderApp(); });
    });

    document.querySelectorAll('[data-lesson]').forEach(function(btn){
      btn.addEventListener('click', function(){ startLesson(parseInt(btn.getAttribute('data-lesson'),10)); });
    });

    document.querySelectorAll('[data-story]').forEach(function(btn){
      btn.addEventListener('click', function(){ openStory(btn.getAttribute('data-story')); });
    });

    var markReadBtn = document.getElementById('btnMarkRead');
    if(markReadBtn) markReadBtn.addEventListener('click', markStoryRead);

    var typingInput = document.getElementById('typingInput');
    if(typingInput) typingInput.addEventListener('input', handleTypingInput);

    var nextBtn = document.getElementById('btnNextSnippet');
    if(nextBtn) nextBtn.addEventListener('click', nextSnippet);

    document.querySelectorAll('[data-op]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.cal.operation = btn.getAttribute('data-op'); renderApp(); });
    });
    document.querySelectorAll('[data-level]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.cal.level = parseInt(btn.getAttribute('data-level'),10); renderApp(); });
    });

    var startGameBtn = document.getElementById('btnStartGame');
    if(startGameBtn) startGameBtn.addEventListener('click', startGame);

    document.querySelectorAll('.opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ answerQuestion(parseInt(btn.getAttribute('data-val'),10)); });
    });

    var playAgain = document.getElementById('btnPlayAgain');
    if(playAgain) playAgain.addEventListener('click', startGame);

    var changeLevel = document.getElementById('btnChangeLevel');
    if(changeLevel) changeLevel.addEventListener('click', function(){ state.view='calistungMenu'; renderApp(); });

    var shareBtn = document.getElementById('btnShareQR');
    if(shareBtn) shareBtn.addEventListener('click', openQRModal);

    var shareBtnMini = document.getElementById('btnShareQRMini');
    if(shareBtnMini) shareBtnMini.addEventListener('click', openQRModal);

    var closeQRBtn = document.getElementById('btnCloseQR');
    if(closeQRBtn) closeQRBtn.addEventListener('click', closeQRModal);

    var qrOverlay = document.getElementById('qrOverlay');
    if(qrOverlay) qrOverlay.addEventListener('click', function(e){
      if(e.target === qrOverlay) closeQRModal();
    });

    var copyLinkBtn = document.getElementById('btnCopyLink');
    if(copyLinkBtn) copyLinkBtn.addEventListener('click', copyShareLink);
  }

  renderApp();
})();
</script>
</body>
</html>
